# Nginx reverse proxy for LibreClassroom — native VPS deployment.
#
# Three subdomains with path-based separation:
#   libreclass.<your-domain>       → dashboard SSR (PM2 :3082)
#   libreclass-api.<your-domain>   → API (PM2 :3081)
#   libreclass-files.<your-domain> → MinIO storage (Docker :9000)
#
# TLS termination uses your own certificate and key. Replace the cert paths
# below, or use certbot/ACME to automate issuance.
#
# Install:
#   sudo cp infra/nginx-classroomio.conf /etc/nginx/sites-available/classroomio
#   sudo ln -s /etc/nginx/sites-available/classroomio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── TLS certificate placeholders ────────────────────────────────────────────
# Replace with your actual certificate paths. Examples:
#   Certbot:     /etc/letsencrypt/live/yourdomain/fullchain.pem
#   Cloudflare:  /etc/ssl/cloudflare.pem  +  /etc/ssl/cloudflare.key
#   Self-signed: /etc/ssl/certs/nginx-selfsigned.crt
#ssl_certificate     /etc/ssl/certs/classroomio.crt;
#ssl_certificate_key /etc/ssl/private/classroomio.key;

# ── Dashboard (SvelteKit SSR) ───────────────────────────────────────────────
server {
    listen 80;
    server_name libreclass.mydomain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name libreclass.mydomain.org;

    # ssl_certificate     /etc/ssl/certs/classroomio.crt;
    # ssl_certificate_key /etc/ssl/private/classroomio.key;

    access_log /var/log/nginx/classroomio-dashboard-access.log;
    error_log  /var/log/nginx/classroomio-dashboard-error.log;

    add_header X-Content-Type-Options "nosniff";

    # Video/document uploads go through the dashboard proxy to the API.
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        # SvelteKit + better-auth set large response headers (multiple
        # Set-Cookie, CSP nonces). Without these buffers nginx returns 502
        # ("upstream sent too big header").
        proxy_buffer_size         64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size  128k;
    }
}

# ── API (Hono / @hono/node-server) ──────────────────────────────────────────
server {
    listen 80;
    server_name libreclass-api.mydomain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name libreclass-api.mydomain.org;

    # ssl_certificate     /etc/ssl/certs/classroomio.crt;
    # ssl_certificate_key /etc/ssl/private/classroomio.key;

    access_log /var/log/nginx/classroomio-api-access.log;
    error_log  /var/log/nginx/classroomio-api-error.log;

    add_header X-Content-Type-Options "nosniff";

    # Media uploads via presigned URLs can be large.
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;

        proxy_buffer_size         64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size  128k;
    }
}

# ── Tenant subdomains (optional) ────────────────────────────────────────────
