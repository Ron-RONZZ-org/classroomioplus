# ── MinIO storage ───────────────────────────────────────────────────────────
# Exposes the S3-compatible API (port 9000) for browser uploads and media
# delivery. The media bucket is public; videos and documents use presigned
# URLs and remain private even though the endpoint is exposed.
server {
    listen 80;
    server_name libreclass-files.mydomain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name libreclass-files.mydomain.org;

    # ssl_certificate     /etc/ssl/certs/classroomio.crt;
    # ssl_certificate_key /etc/ssl/private/classroomio.key;

    access_log /var/log/nginx/classroomio-files-access.log;
    error_log  /var/log/nginx/classroomio-files-error.log;

    # Presigned PUT uploads of videos/documents can be large.
    client_max_body_size 500M;

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;

        # Stream uploads directly to MinIO without buffering to disk.
        proxy_request_buffering off;
    }
}
